<Virtualhost *:80>
    ServerName  tiqr
    ServerAdmin admin@surf.nl

    DocumentRoot /var/www/html/public
    SetEnv HTTPS on
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    <Directory "/var/www/html/public">
        Require all granted

        Options -MultiViews
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>
    <Location />
        Require all granted
    </Location>

    Header always set X-Content-Type-Options "nosniff"

    # Set the php application handler so mod_php interpets the files
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    ExpiresActive on
    ExpiresByType font/* "access plus 1 year"
    ExpiresByType image/* "access plus 6 months"
    ExpiresByType text/css "access plus 1 year"
    ExpiresByType text/js "access plus 1 year"

    # Define the JSON Log Format
    LogFormat "{ \
      \"time\": \"%{%Y-%m-%dT%H:%M:%S%z}t\", \
      \"remote_ip\": \"%a\", \
      \"host\": \"%v\", \
      \"method\": \"%m\", \
      \"url\": \"%U\", \
      \"query\": \"%q\", \
      \"protocol\": \"%H\", \
      \"status\": \"%>s\", \
      \"bytes_sent\": \"%B\", \
      \"referer\": \"%{Referer}i\", \
      \"user_agent\": \"%{User-Agent}i\", \
      \"response_time_microseconds\": \"%D\", \
      \"forwarded_for\": \"%{X-Forwarded-For}i\", \
      \"http_version\": \"%H\", \
      \"request\": \"%r\", \
      \"x-stepup-request-id\": \"%{x-stepup-request-id}o\" \
    }" json

    CustomLog /dev/stdout json
    ErrorLog  /dev/stderr
    LogLevel warn
</VirtualHost>
