name: Run QA tests (static analysis, lint and unit tests)
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  run-qa-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: /var/www/html/
    container:
      image:  ghcr.io/openconext/openconext-basecontainers/php85-apache2-node24:latest
      volumes:
        - .:/var/www/html

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Composer install
        run: composer install

      - name: Yarn install
        run: yarn

      - name: Run QA tests
        run: composer check-ci
